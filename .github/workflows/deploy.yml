name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          NEXT_PUBLIC_SERVER_URL: https://content.ourmoon.org.uk
          NEXT_PUBLIC_FRONTEND_URL: https://devnext.ourmoon.org.uk

      - name: Run migrations
        run: pnpm payload migrate
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Deploy to Cloudflare Workers
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          FRONTEND_REVALIDATE_URL: ${{ secrets.FRONTEND_REVALIDATE_URL }}
          FRONTEND_REVALIDATE_SECRET: ${{ secrets.FRONTEND_REVALIDATE_SECRET }}
          NEXT_PUBLIC_SERVER_URL: https://content.ourmoon.org.uk
          NEXT_PUBLIC_FRONTEND_URL: https://devnext.ourmoon.org.uk
